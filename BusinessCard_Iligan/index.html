<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dhayan Jane Iligan — Business Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="page-title">Digital Business Card</h1>

  <div class="deck">

    <!-- FRONT -->
    <section class="deck__item">
      <p class="deck__label">Front</p>
      <main class="card card--front">
        <div class="card__dots card__dots--front" aria-hidden="true"></div>
        <div class="card__front-content">
          <div class="card__brand">
            <img class="card__bolt" src="assets/logo.png" alt="Diafy logo">
            <span class="card__brand-name">DIAFY</span>
          </div>
          <p class="card__tagline">Create, Learn, Commission</p>
        </div>
      </main>
    </section>

    <!-- BACK -->
    <section class="deck__item">
      <p class="deck__label">Back</p>
      <main class="card card--back">
        <div class="card__dots card__dots--back" aria-hidden="true"></div>
        <div class="card__content">
          <div class="card__heading">
            <h2 class="card__name">Dhayan Jane Iligan</h2>
            <p class="card__title">App Developer</p>
          </div>

          <ul class="card__contact">
            <li>
              <img class="card__icon" src="assets/icon-phone.svg" alt="">
              <span>+0991 1387 055</span>
            </li>
            <li>
              <img class="card__icon" src="assets/icon-globe.svg" alt="">
              <span>www.diafy.com</span>
            </li>
            <li>
              <img class="card__icon" src="assets/icon-mail.svg" alt="">
              <span>diafy@gmail.com</span>
            </li>
            <li>
              <img class="card__icon" src="assets/icon-location.svg" alt="">
              <span>Purok 5, Causwagan Kilid sa poste</span>
            </li>
          </ul>
        </div>
      </main>
    </section>

  </div>

</body>
</html>
